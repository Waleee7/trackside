[project]
name = "trackside"
version = "0.1.0"
description = "Measure track & field events from a single camera - with honest error bars."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.scripts]
trackside = "trackside.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trackside*"]
